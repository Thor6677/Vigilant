{% extends "base.html" %}
{% block title %}Admin — VIGILANT{% endblock %}
{% block breadcrumbs %}
<div class="b-breadcrumbs"><a href="/dashboard">Dashboard</a><span class="b-crumb-sep">&gt;</span><span class="b-crumb-current">Admin</span></div>
{% endblock %}

{% block content %}
<div class="b-page-header">
    <h1 class="b-page-title">Admin</h1>
</div>

<div class="b-tab-strip" id="admin-tabs">
    <button type="button" class="is-active" data-click="switchTab" data-section="overview">Overview</button>
    <button type="button" data-click="switchTab" data-section="users">Users</button>
    <button type="button" data-click="switchTab" data-section="esi">ESI Health</button>
    <button type="button" data-click="switchTab" data-section="scheduler">Scheduler</button>
    <button type="button" data-click="switchTab" data-section="database">Database</button>
    <button type="button" data-click="switchTab" data-section="sde">SDE</button>
    <button type="button" data-click="switchTab" data-section="audit">Audit Log</button>
</div>

<div id="admin-content"
     hx-get="/admin/section/overview"
     hx-trigger="load"
     hx-swap="innerHTML">
    <div class="b-empty">Loading...</div>
</div>

<script nonce="{{ request.state.csp_nonce }}">
var currentSection = 'overview';
var refreshTimer = null;

function switchTab() {
    var section = this.dataset.section;
    var el = this;
    currentSection = section;
    document.querySelectorAll('#admin-tabs button').forEach(function(b) { b.classList.remove('is-active'); });
    el.classList.add('is-active');
    htmx.ajax('GET', '/admin/section/' + section, '#admin-content');

    /* Auto-refresh active section */
    if (refreshTimer) clearInterval(refreshTimer);
    var refreshSections = {'overview': 10000, 'scheduler': 5000, 'esi': 5000};
    var interval = refreshSections[section];
    if (interval) {
        refreshTimer = setInterval(function() {
            htmx.ajax('GET', '/admin/section/' + currentSection, '#admin-content');
        }, interval);
    }
}

/* Start auto-refresh for overview */
refreshTimer = setInterval(function() {
    htmx.ajax('GET', '/admin/section/' + currentSection, '#admin-content');
}, 10000);
</script>
{% endblock %}
