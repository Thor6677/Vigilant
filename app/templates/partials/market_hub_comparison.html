{# htmx partial — swapped via innerHTML into #mk-hubs on market_type.html, so
   no extends; the .hc-* rules are in that page's <style> block. Context is
   built by app/routes/market_hubs.py from app/market/hub_view.py.

   Desktop: one table, a row per hub with its verdict underneath (m-hide on
   phones). Phones: one card per hub (m-only). Changing any input re-requests
   the section; there are no inline handlers (CSP). #}
{% set span = 9 if show_route else 8 %}
{% macro tags(r) -%}
<span class="hc-tag hc-{{ r.speed }}">{{ r.speed_label }}</span>
{%- if r.supply %} <span class="hc-tag hc-{{ r.supply }}">{{ r.supply_label }}</span>{% endif %}
{%- endmacro %}
{% macro trend(r) -%}
{% if r.trend == 'up' %}<span class="hc-pos" title="7-day rate is above the 30-day rate">▲</span>
{%- elif r.trend == 'down' %}<span class="hc-neg" title="7-day rate is below the 30-day rate">▼</span>{% endif %}
{%- endmacro %}
{% macro retry() -%}
<button type="button" class="hc-retry" hx-get="/market/type/{{ type_id }}/hubs"
        hx-include=".hc-inputs" hx-target="#mk-hubs" hx-swap="innerHTML">retry</button>
{%- endmacro %}

<div class="b-section hc">
    <div class="b-section-head">
        <span class="b-label">Hub comparison</span>
        <span class="hc-mut">{{ age_str }}</span>
    </div>

    <form class="hc-inputs" hx-get="/market/type/{{ type_id }}/hubs" hx-target="#mk-hubs"
          hx-swap="innerHTML" hx-trigger="change, submit">
        <label class="hc-fld"><span>Quantity</span>
            <input class="b-input" type="text" inputmode="numeric" name="qty" value="{{ qty }}" style="width:6rem;"></label>
        <label class="hc-fld"><span>Cost per unit</span>
            <select class="b-input b-select" name="cost_mode">
                {% if has_benchmark %}<option value="benchmark"{% if cost_mode == 'benchmark' %} selected{% endif %}>Benchmark</option>{% endif %}
                <option value="build"{% if cost_mode == 'build' %} selected{% endif %}>My build</option>
                <option value="typed"{% if cost_mode == 'typed' %} selected{% endif %}>Typed</option>
            </select></label>
        <label class="hc-fld"><span>ISK each</span>
            <input class="b-input" type="text" inputmode="decimal" name="cost" value="{{ cost_value }}"
                   placeholder="e.g. 180m"{% if cost_mode == 'benchmark' %} readonly{% endif %} style="width:10rem;"></label>
        <label class="hc-fld"><span>Starting system</span>
            <input class="b-input" type="text" name="origin" value="{{ origin_name }}" placeholder="none" style="width:9rem;"></label>
        <label class="hc-fld"><span>Sales tax %</span>
            <input class="b-input" type="text" inputmode="decimal" name="sales_tax" value="{{ sales_tax_pct }}" style="width:5rem;"></label>
        <label class="hc-fld"><span>Broker fee %</span>
            <input class="b-input" type="text" inputmode="decimal" name="broker_fee" value="{{ broker_fee_pct }}" style="width:5rem;"></label>
        <span class="hc-fld">
            <button type="button" class="b-btn is-ghost" hx-post="/market/hub-prefs"
                    hx-include="closest form" hx-target="#hc-saved" hx-swap="innerHTML">Save fees and start</button>
        </span>
        <span id="hc-saved" class="hc-mut" role="status"></span>
    </form>
    {% for note in notes %}<div class="hc-note">{{ note }}</div>{% endfor %}

    {% if picks %}
    <div class="hc-picks">
        {% for p in picks %}
        <div class="hc-pick">
            <div class="hc-pick-k">{{ p.k }}</div>
            <div class="hc-pick-v">{{ p.v }}</div>
            <div class="hc-pick-d">{{ p.d }}</div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <table class="hc-table m-hide">
        <thead>
            <tr>
                <th></th>
                <th colspan="3" class="hc-grp">Market</th>
                <th colspan="3" class="hc-grp hc-gl">List and wait</th>
                <th colspan="2" class="hc-grp hc-gl">Sell now</th>
                {% if show_route %}<th class="hc-gl"></th>{% endif %}
            </tr>
            <tr>
                <th>Hub</th><th>Lowest sell</th><th>Sold / day</th><th>Stock · days</th>
                <th class="hc-gl">Profit each</th><th>Margin</th><th>Days to sell {{ qty }}</th>
                <th class="hc-gl">Avg price</th><th>Profit each</th>
                {% if show_route %}<th class="hc-gl">Route</th>{% endif %}
            </tr>
        </thead>
        <tbody>
        {% for r in rows %}
            {% if r.unavailable %}
            <tr class="hc-r">
                <td><span class="hc-hub">{{ r.name }}</span></td>
                <td colspan="{{ span }}" class="hc-unavail">Unavailable — {{ retry() }}</td>
            </tr>
            {% else %}
            <tr class="hc-r">
                <td><span class="hc-hub">{{ r.name }}</span> {{ tags(r) }}</td>
                <td>{{ r.lowest_sell }}</td>
                <td>{{ r.demand_30 }} {{ trend(r) }}<span class="hc-small">7d: {{ r.demand_7 }}</span></td>
                <td>{{ r.stock }}<span class="hc-small">{{ r.stock_days }}</span></td>
                <td class="hc-gl hc-{{ r.lw_sign }}">{{ r.lw_profit }}</td>
                <td>{{ r.lw_margin }}</td>
                <td>{{ r.lw_days }}</td>
                <td class="hc-gl">{{ r.now_avg }}<span class="hc-small">{{ r.now_fill }}</span></td>
                <td class="hc-{{ r.now_sign }}">{{ r.now_profit }}</td>
                {% if show_route %}<td class="hc-gl">{{ r.route or '—' }}<span class="hc-small">{{ r.route_note }}</span></td>{% endif %}
            </tr>
            <tr class="hc-s">
                <td colspan="{{ span + 1 }}">{{ r.verdict }}{% if r.outlier_note %} <span class="hc-mut">({{ r.outlier_note }})</span>{% endif %}</td>
            </tr>
            {% endif %}
        {% endfor %}
        </tbody>
    </table>

    <div class="hc-cards m-only">
        {% for r in rows %}
        {% if r.unavailable %}
        <div class="hc-card">
            <div class="hc-ch"><span class="hc-hub">{{ r.name }}</span></div>
            <div class="hc-say">Unavailable — {{ retry() }}</div>
        </div>
        {% else %}
        <div class="hc-card">
            <div class="hc-ch"><span class="hc-hub">{{ r.name }}</span><span class="hc-tags">{{ tags(r) }}</span></div>
            <div class="hc-say">{{ r.verdict }}{% if r.outlier_note %} <span class="hc-mut">({{ r.outlier_note }})</span>{% endif %}</div>
            <div class="hc-mkt">
                <div><div class="hc-n">{{ r.lowest_sell }}</div><div class="hc-l">Lowest sell</div></div>
                <div><div class="hc-n">{{ r.demand_30 }} {{ trend(r) }}</div><div class="hc-l">Sold / day</div></div>
                <div><div class="hc-n">{{ r.stock }}{% if r.stock_days %} · {{ r.stock_days }}{% endif %}</div><div class="hc-l">Stock</div></div>
            </div>
            <div class="hc-two">
                <div>
                    <h4>List and wait</h4>
                    <div class="hc-row"><span>Profit each</span><span class="hc-{{ r.lw_sign }}">{{ r.lw_profit }}</span></div>
                    <div class="hc-row"><span>Margin</span><span>{{ r.lw_margin }}</span></div>
                    <div class="hc-row"><span>Days to sell {{ qty }}</span><span>{{ r.lw_days }}</span></div>
                    <div class="hc-row"><span>Batch profit</span><span class="hc-{{ r.lw_sign }}">{{ r.lw_batch }}</span></div>
                </div>
                <div>
                    <h4>Sell now</h4>
                    <div class="hc-row"><span>Avg price</span><span>{{ r.now_avg }}</span></div>
                    <div class="hc-row"><span>Profit each</span><span class="hc-{{ r.now_sign }}">{{ r.now_profit }}</span></div>
                    <div class="hc-row"><span>Buy side</span><span>{{ r.now_fill or '—' }}</span></div>
                    <div class="hc-row"><span>Batch profit</span><span class="hc-{{ r.now_sign }}">{{ r.now_batch }}</span></div>
                </div>
            </div>
            <div class="hc-cf">
                <span>{% if show_route and r.route %}{{ r.route }} · {{ r.route_note }}{% endif %}</span>
                <span>Highest buy {{ r.highest_buy }}</span>
            </div>
        </div>
        {% endif %}
        {% endfor %}
    </div>

    <div class="hc-foot">
        Sold / day is the 30-day rate for the hub's whole region (the game publishes no
        per-station history) and includes sales to buy orders, so days to sell leans
        optimistic. Days to sell: best case (you stay cheapest) – typical (you share
        buyers with stock priced within 10% of the lowest sell). Stock counts only that
        nearby stock. Sell-now batch profit covers only the units buy orders can take.
    </div>
</div>
