services:
  app:
    # Pulled, not built. Release CI builds this image from a version tag (see
    # .github/workflows/release.yml) so what runs here is byte-identical to what
    # was tested on the dev instance — a rebuild could resolve different base
    # layers, since the Dockerfile deliberately tracks floating python/node tags.
    #
    # scripts/deploy.sh sets VIGILANT_TAG; the :latest default exists only so a
    # bare `docker compose up` outside the script still works. To build from
    # source instead, add the overlay:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    #
    # The registry half is VIGILANT_IMAGE, the SAME variable scripts/deploy.sh
    # already resolves for its own `docker pull` (with the same default). When
    # only the script knew about it, deploy.sh pulled from one registry while
    # compose ran whatever this line hardcoded, and the two silently disagreed
    # about what a tag meant. A fork also could not run at all: release.yml
    # publishes a fork's images into the fork's own namespace, which this line
    # could never name. The default below resolves to the byte-identical string
    # it always did, so an existing install's compose config is unchanged and
    # nothing is recreated on the release that introduces this.
    image: ${VIGILANT_IMAGE:-ghcr.io/thor6677/vigilant}:${VIGILANT_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/vigilant.db
      - UPLOADS_DIR=/data/uploads
      # ISS-013: persist vigilant.perf lines to a rotating file on the
      # /data volume so perf measurements survive container recreates.
      # Stdout is still written for `docker logs` visibility; this is
      # additive. VIGILANT_PERF_LOG=1 lives in .env.
      - VIGILANT_PERF_FILE=/data/logs/perf.log
    volumes:
      - app_data:/data
      # The updater IPC channel. Writable even though the rootfs is read_only —
      # /control is the one place the app may write besides /data and /tmp. The
      # app never gets the Docker socket; writing one JSON file here is the
      # entire capability it has over deployment.
      - control:/control
    networks:
      - web
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Minimum caps the entrypoint needs to run as root, chown /data,
    # and drop to the vigilant uid via gosu before exec'ing uvicorn.
    # See docker-entrypoint.sh and VVP-2026-003 / T-004. Once the
    # entrypoint has handed off, the running uvicorn process holds no
    # capabilities (gosu drops them along with the uid).
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 2560M
          cpus: "2.0"
          pids: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── In-app updater (profile-gated, off by default) ────────────────────────
  #
  # ABSENT unless explicitly asked for:
  #   docker compose --profile updater up -d
  # No profile means no container, which means no heartbeat, which means the
  # app hides the button and 404s the routes. A default install is
  # byte-identical to one without this block.
  #
  # This container holds the Docker socket, which is root-equivalent on the host
  # by construction — anything that can create containers can create a
  # privileged one. The design does not pretend otherwise; it narrows the
  # capability to two operations, gives it no network listener, and keeps the
  # app itself unprivileged.
  updater:
    profiles: ["updater"]
    # Separate variable from the app's, because they are separate images built
    # from separate Dockerfiles — a fork or a mirror may well hold them in
    # different places. Same reasoning as the app's line above, and the same
    # byte-identical default.
    #
    # This line is also what the sidecar's self-update reads: it asks
    # `docker compose config` for services.updater.image rather than
    # string-building a name, so a non-default registry reaches the self-update
    # for free. That matters here specifically, because the self-update helper
    # runs compose with an explicit `-f` — which suppresses
    # docker-compose.override.yml — so interpolation from .env is the ONLY way a
    # non-default registry can reach the sidecar recreate.
    image: ${VIGILANT_UPDATER_IMAGE:-ghcr.io/thor6677/vigilant-updater}:${VIGILANT_TAG:-latest}
    restart: unless-stopped
    # NOT root. Everything this writes into the host repo — .git objects, the
    # .deployed log — must stay owned by the repo owner, or the SSH fallback
    # this feature keeps as its escape hatch stops working. Socket access comes
    # from the supplementary group instead of from uid 0.
    user: "${VIGILANT_UID:-1000}:${VIGILANT_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-983}"   # getent group docker | cut -d: -f3
      - "10001"                # the app's gid, for the shared /control volume
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The two sides MUST be identical, which is why one variable fills both.
      # compose derives its project identity from the working directory, so the
      # path inside the container decides WHICH STACK gets recreated: mount the
      # repo at a different path than the sidecar reports as its root and
      # compose treats it as a new project, creating a SECOND app container
      # bound to the same data volume instead of recreating the running one.
      #
      # Parameterised rather than hardcoded because hardcoding it is a
      # foot-gun, not a safety measure: a second stack that enables this profile
      # would silently bind PRODUCTION's repo and deploy the wrong site.
      # Observed on the throwaway verification stack, 2026-09-14 — the sidecar
      # came up reporting root=/opt/vigilant and production's current_tag while
      # running under a completely different compose project. Default is
      # unchanged, so a normal install behaves exactly as before.
      - ${VIGILANT_ROOT:-/opt/vigilant}:${VIGILANT_ROOT:-/opt/vigilant}
      - control:/control
      - type: tmpfs
        target: /tmp
        # Long form, not the short `tmpfs: [/tmp]` list the app service uses
        # below: the short list takes bare paths only, and this mount needs
        # two options the app's /tmp does not.
        #
        # size caps it. Docker's own tmpfs default is UNBOUNDED — a tmpfs is
        # backed by RAM, not disk, so an unbounded one does not fail with
        # ENOSPC when something runs away, it eats host memory instead. 64m is
        # generous for what actually lands here: docker-cli-compose's own
        # writes under HOME (see updater/Dockerfile) and nothing else, since
        # deploy.sh/rollback.sh's own tmp usage is the bind-mounted ROOT copy
        # of themselves (see the self-modification guard atop both scripts),
        # not this mount.
        #
        # mode: 1777 (world-writable, sticky) is specified explicitly rather
        # than left to rely on whatever this Compose version's own default
        # turns out to be: unlike the app service's uid 10001 baked into its
        # image, this container's uid comes from VIGILANT_UID per install (see
        # `user:` above) and is not known at image-build time, so the mount
        # must be writable by whichever uid that turns out to be.
        #
        # Docker's tmpfs default also adds `noexec`, which is fine here: this
        # container never executes anything from /tmp. deploy.sh and
        # rollback.sh re-exec themselves from a `mktemp -d` elsewhere on the
        # HOST filesystem (the bind-mounted repo root, not this tmpfs) via
        # `exec bash "<file>"` — bash READS that file and interprets it, it
        # does not execute it as a binary, so noexec on /tmp never enters into
        # it either way.
        tmpfs:
          size: 64m
          mode: 1777
    environment:
      - VIGILANT_ROOT=${VIGILANT_ROOT:-/opt/vigilant}
      - VIGILANT_CONTROL_DIR=/control
      # Passed through so the deploy.sh that runs INSIDE this container resolves
      # the same registry the compose file does. Both now read the same
      # VIGILANT_IMAGE with the same default, so on a stock install they cannot
      # disagree; this entry is what carries a non-default value across the
      # container boundary, since the sidecar has no env_file of its own.
      # Without it, an install that sets VIGILANT_IMAGE in .env gets a sidecar
      # whose deploy.sh falls back to the ghcr.io default while compose uses the
      # override — the two then disagree about what "v1.2.3" means, which
      # surfaces as a "not found" at pull time. Caught on a mirrored throwaway
      # stack, 2026-09-14. Default is unchanged.
      - VIGILANT_IMAGE=${VIGILANT_IMAGE:-ghcr.io/thor6677/vigilant}
    # Deliberately NOT on the `web` bridge: it publishes no ports and has no
    # listener, so nothing should be able to reach it. It still needs outbound
    # for `git fetch`, which the project's default network provides. The image
    # pull is performed by the daemon, not by this process.
    security_opt:
      - no-new-privileges:true
    # Parity with the app service above, and honest sizing about what it buys:
    # this container already runs as a non-root uid with no-new-privileges (see
    # `user:` above), so it holds no effective capabilities and its image files
    # are root-owned, so it cannot write them regardless of this line. More
    # fundamentally, this container holds the Docker socket — socket access is
    # root on the host by construction, and cap_drop/read_only do not contain a
    # compromised sidecar; nothing below changes that. What it does buy is real:
    # no writable rootfs to persist anything into, no capability this container
    # ever needed, and the most privileged service in the stack no longer being
    # the one visibly least hardened.
    cap_drop:
      - ALL
    # No cap_add, unlike the app service above: this container is never root at
    # any point in its life — no entrypoint chown, no gosu drop, so there is no
    # brief root window here that needs a capability handed back afterwards.
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
  # 0770 vigilant:vigilant, established by the app's entrypoint — a fresh named
  # volume is root-owned 0755, which would leave the app able to read but not
  # write, and the first click failing on permissions.
  control:

networks:
  # Shared external bridge. Edge nginx (separate stack at /opt/edge/ on
  # the VPS, or whatever reverse proxy you're running) attaches here and
  # upstreams vigilant by container name (`vigilant-app-1:8000`).
  # Bring vigilant up alongside other apps with:
  #   docker network create web   # one-time, host-level
  # See docs/nginx-sample.conf for a single-app vhost example.
  web:
    external: true
    name: web
